<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cosmic Explorers</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark position-relative px-3 py-3">

  <!-- LEFT -->
  <div class="d-flex gap-2">
    <a href="index.html" class="btn btn-outline-light">Home</a>
    <a href="challenges.html" class="btn btn-outline-success ">Challenges</a>
    <a href="reviews.html" class="btn btn-outline-primary ">Reviews</a>
  </div>

  <!-- CENTER (absolute) -->
  <div class="position-absolute top-50 start-50 translate-middle">
    <span class="fw-bold text-primary fs-4">
      Cosmic Explorers
    </span>
  </div>

  <!-- RIGHT -->
  <div class="d-flex gap-2 ms-auto">
    <a id="loginButton" href="login.html" class="btn btn-outline-info">Login</a>
    <a id="registerButton" href="register.html" class="btn btn-outline-warning">Register</a>
    <button id="logoutButton" class="btn btn-danger btn-sm d-none">Logout</button>
  </div>

</nav>
<!-- MAIN -->
<div class="container mt-4">

  <h1 class="text-center mb-4">Explore New Worlds 🌌</h1>

  <div class="row g-4">

    <!-- Planet Card -->
    <div class="col-md-4">
      <div class="card h-100 text-center">
        <img src="images/Earth.webp" class="card-img-top">
        <div class="card-body">
          <h5>Earth</h5>
          <p>Beginner • Home Planet</p>
          <p><strong>100 pts</strong></p>
          <button class="btn btn-primary" onclick="buyPlanet('Earth',100)">
            Unlock
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 text-center">
        <img src="images/Mars.png" class="card-img-top">
        <div class="card-body">
          <h5>Mars</h5>
          <p>Intermediate • Endurance</p>
          <p><strong>300 pts</strong></p>
          <button class="btn btn-primary" onclick="buyPlanet('Mars',300)">
            Unlock
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 text-center">
        <img src="images/Jupiter.png" class="card-img-top">
        <div class="card-body">
          <h5>Jupiter</h5>
          <p>Advanced • Mastery</p>
          <p><strong>500 pts</strong></p>
          <button class="btn btn-primary" onclick="buyPlanet('Jupiter',500)">
            Unlock
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/footer.js"></script>
<script src="js/navbar.js"></script>
<script src="js/index.js"></script>
</body>
</html>
