<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Invaders - Reviews</title>
    <!--bootstrap css and icons-->
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel = "stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link href = "../css/reviews.css" rel = "stylesheet" >
</head>
<body class="bg-dark text-light"> <!-- set bg to dark and text to white-->
    <!-- navigation bar -->
<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark position-relative px-3 py-3">

  <!-- LEFT -->
  <div class="d-flex gap-2">
    <a href="index.html" class="btn btn-outline-light">Home</a>
    <a href="challenges.html" class="btn btn-outline-success ">Challenges</a>
    <a href="reviews.html" class="btn btn-outline-primary ">Reviews</a>
  </div>

  <!-- CENTER (absolute) -->
  <div class="position-absolute top-50 start-50 translate-middle">
    <span class="fw-bold text-primary fs-4">
      Cosmic Explorers
    </span>
  </div>

  <!-- RIGHT -->
  <div class="d-flex gap-2 ms-auto">
    <a id="loginButton" href="login.html" class="btn btn-outline-info">Login</a>
    <a id="registerButton" href="register.html" class="btn btn-outline-warning">Register</a>
    <button id="logoutButton" class="btn btn-danger btn-sm d-none">Logout</button>
  </div>

</nav>


    <div class="container mt-4">

        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <!-- card -->
                <div class="card bg-black">
                    <div class="card-body">
                        <h5 class="card-title text-center">Write a Review</h5>
                        <p class="text-center">Note : You will need to login to your account to submit a review.</p>
                        <p class="text-center">You can register for one if you do not already have an account.</p>
                        
                        <!-- review form -->
                        <form id="reviewForm">    
                            <div class="mb-3">
                                <label class="form-label">Rating</label>
                                <div id="starRating">
                                    <i class="bi bi-star" data-rating="1"></i>
                                    <i class="bi bi-star" data-rating="2"></i>
                                    <i class="bi bi-star" data-rating="3"></i>
                                    <i class="bi bi-star" data-rating="4"></i>
                                    <i class="bi bi-star" data-rating="5"></i>
                                </div>
                                <input type="hidden" name="rating" id="selected-rating" required>
                            </div>
        
                            <div class="mb-3">
                                <label for="reviewText" class="form-label">Your Review</label>
                                <textarea class="form-control" id="reviewText" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark">Submit Review</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    <!-- heading -->
    <h1 class="text-center mb-4">Reviews</h1> 
    <div id="reviewsContainer"></div>

    <br>
    <!-- footer  -->
    <footer class="footer text-center mt-4">
        <div class="container">
            <span>&copy; 2025.</span>
        </div>
    </footer>

    <!-- for alerts -->
    <div id="alertContainer" class="position-fixed bottom-0 end-0 p-3">
    </div>

    <!-- axios and bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- js files -->
       <script src="js/navbar.js"></script>
     <script src="js/fetchMethod.js"></script>
    <script src="js/reviews.js"></script>

</body>
</html>
